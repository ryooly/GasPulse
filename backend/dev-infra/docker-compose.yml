# GasPulse dev infrastructure — PostgreSQL only.
#
# The FastAPI app is NOT containerized: run it locally with uvicorn and point it
# at this database via DATABASE_URL (see seed.py / verify_real_data.py).
#
# Everything under dev-infra/ is self-contained and safe to delete:
#   docker compose -f dev-infra/docker-compose.yml up -d       # start Postgres
#   docker compose -f dev-infra/docker-compose.yml down         # stop (keeps data)
#   docker compose -f dev-infra/docker-compose.yml down -v      # stop + wipe data

services:
  db:
    image: postgres:16-alpine
    container_name: gaspulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gaspulse
      POSTGRES_PASSWORD: gaspulse
      POSTGRES_DB: gaspulse
    ports:
      # Host 5433 -> container 5432. 5433 avoids a common clash with a locally
      # installed PostgreSQL that already listens on 5432.
      - "5433:5432"
    volumes:
      - gaspulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaspulse -d gaspulse"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  gaspulse_pgdata:
